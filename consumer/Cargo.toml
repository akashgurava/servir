[package]
name = "echo-server"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "echo-server"
path = "src/main.rs"

[dependencies]
servir = { path = "..", features = ["telemetry"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tracing = "0.1"
