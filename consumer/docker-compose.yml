services:
  echo-server:
    build:
      # Workspace context: includes both servir/ and consumer/ for the path dependency.
      # Standalone repo: change to `context: .` and update servir dep to a published version.
      context: ..
      dockerfile: consumer/Dockerfile
    image: echo-server:latest
    ports:
      - "${HOST_PORT:-3000}:3000"
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      CONSUMER_AUTH_DB: ${CONSUMER_AUTH_DB:-/data/db/auth.db}
      CONSUMER_DATA_DB: ${CONSUMER_DATA_DB:-/data/db/data.db}
      CONSUMER_LOG_DIR: ${CONSUMER_LOG_DIR:-/data/logs}
    volumes:
      - app-data:/data
    restart: unless-stopped

volumes:
  app-data:
