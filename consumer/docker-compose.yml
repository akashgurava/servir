services:
  echo-server:
    build:
      # Workspace context: includes both servir/ and consumer/ for the path dependency.
      # Standalone repo: change to `context: .` and update servir dep to a published version.
      context: ..
      dockerfile: consumer/Dockerfile
    image: echo-server:latest
    ports:
      - "${HOST_PORT:-3000}:3000"
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      AUTH_DATABASE_URL: ${AUTH_DATABASE_URL:-sqlite://auth.db}
      APP_DATABASE_URL: ${APP_DATABASE_URL:-sqlite://app.db}
    restart: unless-stopped
