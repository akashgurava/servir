[workspace]
members = [".", "consumer"]
resolver = "2"

[package]
name = "servir"
version = "0.1.0"
edition = "2024"

[features]
default = ["telemetry"]
telemetry = ["dep:tracing-subscriber"]

[dependencies]
axum = "0.8"
thiserror = "2"
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.6", features = ["trace", "request-id", "uuid"] }
tokio = { version = "1", features = ["net"] }
tracing-subscriber = { version = "0.3", features = [
    "env-filter",
    "fmt",
], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }
tower = { version = "0.5", features = ["util"] }

[[example]]
name = "echo_server"
required-features = ["telemetry"]
